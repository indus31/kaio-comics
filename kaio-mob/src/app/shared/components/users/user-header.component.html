
<ion-card class="secondaryColorBg">
    
      
            <ion-item class="secondaryColorBg">
              <ion-avatar slot="start" class="whiteBg">
                
                  <img alt="Silhouette of a person's head" [src]="user.profilePicture"/>
               
              </ion-avatar>
              <ion-label class="userName">{{ user.username }} </ion-label>
              <ion-button [id]="user._id" slot="end" color="light" >
                <ion-icon name="ellipsis-vertical-outline" ></ion-icon>
              </ion-button>
            </ion-item> 
     
    
  </ion-card>
