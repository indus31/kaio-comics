<ion-content class="primaryBg">
  <div class="postList">
    <ion-list class="primaryBg">
      <ion-item *ngFor="let post of posts; let i = index" class="primaryBg">
        <app-post [post]="post" [index]="i"></app-post>
      </ion-item>
    </ion-list>
    <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
</div>
</ion-content>
